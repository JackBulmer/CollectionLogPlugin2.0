name: CollectionLogPlugin
version: 2.0.0
main: collectionlog.CollectionLogPlugin
api-version: '1.21'
author: JackBulmer
description: Advanced collection tracking system with database backend

softdepend: [GriefPrevention]

commands:
  logs:
    description: Open the collection log GUI
    usage: /logs [collection]
    aliases: [log, collections]

  cl:
    description: Collection Log admin commands
    usage: /cl <collection|item|reload>
    permission: collectionlog.admin

  cldb:
    description: Database management commands
    usage: /cldb <info|backup|list|restore>
    permission: collectionlog.admin

  tags:
    description: Open the tags selection GUI
    usage: /tags
    aliases: [tag]

  perks:
    description: Open the perks management GUI
    usage: /perks
    aliases: [perk]

  craft:
    description: Opens a virtual crafting table
    usage: /craft

  glowing:
    description: Manage your glow colour (Glowing perk)
    usage: /glowing [on|off|<color>]
    aliases: [glow]

  dye:
    description: Open the Infinite Dyes GUI (Infinite Dyes perk)
    usage: /dye

  instantglass:
    description: Toggle the Instant Glass Smelting perk
    usage: /instantglass
    aliases: [iglass, glasssmelt]

  veinminer:
    description: Toggle the Vein Miner perk
    usage: /veinminer
    aliases: [vm, vmine]

  tunnelminer:
    description: Toggle the Tunnel Miner perk
    usage: /tunnelminer
    aliases: [tunnel, tmine]

  harvest:
    description: Toggle the Harvest & Auto-Replant perk
    usage: /harvest
    aliases: [replant, autoreplant]

  sethome:
    description: Create a home waypoint
    usage: /sethome <name> [material]
    permission: collectionlog.teleport.sethome

  delhome:
    description: Delete a home waypoint
    usage: /delhome <name>
    permission: collectionlog.teleport.delhome

  home:
    description: Teleport to a home or update home material
    usage: /home <name> | /home update <name> <material>
    permission: collectionlog.teleport.home

  homes:
    description: Open homes GUI
    usage: /homes
    permission: collectionlog.teleport.homes

  tpr:
    description: Send a teleport request to a player
    usage: /tpr <player>
    permission: collectionlog.teleport.request

  tpa:
    description: Accept a teleport request
    usage: /tpa [player] [charge-me]
    permission: collectionlog.teleport.accept

  tp:
    description: Teleport to home or player
    usage: /tp <home|player>

  hub:
    description: Teleport to the server hub
    usage: /hub
    permission: collectionlog.teleport.hub

  sethub:
    description: Set the server hub location
    usage: /sethub
    permission: collectionlog.admin

  logstats:
    description: Show the top collection log rankings
    usage: /logstats

  logscoreboard:
    description: Create or remove collection log leaderboard scoreboards
    usage: /logscoreboard <create|remove>
    permission: collectionlog.admin.scoreboard

permissions:
  collectionlog.use:
    description: Use collection log features
    default: true
  collectionlog.admin:
    description: Administrative commands
    default: op
  collectionlog.admin.scoreboard:
    description: Create and remove collection log scoreboards
    default: op
  collectionlog.craft:
    description: Use the /craft command (granted when Utilities collection is complete)
    default: false
  collectionlog.teleport.sethome:
    description: Use /sethome command
    default: true
  collectionlog.teleport.delhome:
    description: Use /delhome command
    default: true
  collectionlog.teleport.home:
    description: Use /home command
    default: true
  collectionlog.teleport.homes:
    description: Use /homes command
    default: true
  collectionlog.teleport.request:
    description: Use /tpr command
    default: true
  collectionlog.teleport.accept:
    description: Use /tpa command
    default: true
  collectionlog.teleport.hub:
    description: Use /hub command
    default: true
