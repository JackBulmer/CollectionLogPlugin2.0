# CollectionLogPlugin V2.0 Configuration

# Database Settings
database:
  # Type: sqlite or mysql
  type: sqlite

  # MySQL Settings (only used if type is mysql)
  host: localhost
  port: 3306
  database: collectionlog
  username: root
  password: changeme

# Plugin Settings
plugin:
  # Enable debug logging
  debug: false

  # Auto-save interval (in minutes, 0 = disabled)
  # Note: With database, saves are instant, this is for backup only
  backup-interval: 30

messages:
  collection-complete:
    title: "§6§l✦ Collection Complete! ✦"
    rewards-header: "§aUnlocked Rewards:"
    reward-tag: "§7• §aTag: §e{tag}"
    reward-xp: "§7• §aXP: §e+{xp}"
    reward-item: "§7• §aItems: §e{items}"
    reward-perk: "§7• §aPerk: §e{perk}"

  sub-collection-complete:
    title: "§e§l✦ Sub-Collection Complete! ✦"
    subtitle: "§7{name}"

  progress:
    format: "§a[Collection Log] §7{collection}: §e{current}/{total} §7({percent}%)"

  server-announcement:
    format: "§6{player}§r completed §e{collection} Collection§r!"

# Infinite Dyes Settings
# Track collection progress when dyeing items in the Infinite Dyes GUI
track_dye_collection_progress: false

# Mob drop settings
mob-drops:
  # Chance for spawn eggs to drop (1 in X kills)
  spawn-egg-chance: 10

  # Chance for mob heads to drop (1 in X kills)
  mob-head-chance: 7

  # Enable/disable mob head drops
  mob-heads-enabled: true

  # Enable/disable spawn egg drops
  spawn-eggs-enabled: true

teleport:
  # Default maximum number of homes (capped at 18)
  max_homes: 5

  # XP levels deducted per teleport
  tp_cost: 5

  # Allow teleporting across dimensions (Overworld/Nether/End)
  inter_dimensional_teleporting: true

  # Countdown before teleport executes (seconds); 0 = instant
  countdown_seconds: 5

  # Worlds where homes cannot be created and teleports are blocked
  banned_worlds:
    - "resource_world"
    - "event_world"

  # Milestone name that must be completed before teleports unlock ("" = no lock)
  required_collection: ""

  # Teleport-request expiration time in seconds
  request_timeout: 60
