# Collection milestones
# toast_message and announcement_message are optional.
# Defaults:
#   toast_message: "{Collection Name} Collection Complete!"
#   announcement_message: "{player} has completed the {Collection Name} Collection!"
#
# Tags are defined directly here with their full display names (including colour codes).
#   tags.prefix - list of prefix tag display names awarded on completion
#   tags.suffix - list of suffix tag display names awarded on completion
#
# Global tags (no collection requirement, always available to all players) are defined
# under the top-level "global_tags" section.

global_tags:
  prefix: []
  suffix:
    - " §bis Collecting§r"

