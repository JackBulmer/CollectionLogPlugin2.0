# Collection milestones
# toast_message and announcement_message are optional.
# Defaults:
#   toast_message: "{Collection Name} Collection Complete!"
#   announcement_message: "{player} has completed the {Collection Name} Collection!"

collections:
  wood:
    perks:
      - tree_capitator
    tags:
      - woodcutter

  ores:
    perks:
      - vein_miner
    tags:
      - master_miner

  end:
    perks:
      - double_ender_chest
    tags:
      - end_master

  shulker:
    perks:
      - shulker_access
    tags:
      - shulker_hunter

  sniffer:
    perks:
      - sniffer_flowers
    tags:
      - sniffer_friend

  dyes:
    perks:
      - dye_swap
    tags:
      - colorful

# Sub-collection milestones
sub_collections:
  wood:
    oak:
      xp: 100
      items:
        - "DIAMOND:1"

    spruce:
      xp: 100
      items:
        - "DIAMOND:1"

    birch:
      xp: 100
      items:
        - "DIAMOND:1"

  ores:
    ore blocks:
      xp: 150
      items:
        - "DIAMOND:2"

    ore materials:
      xp: 150
      items:
        - "DIAMOND:2"
